name: CI

on:
  push:
    branches: ["**"]
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

env:
  VT_API_KEY: ${{ secrets.VT_API_KEY }}

jobs:
  ci:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofmt found issues; run 'gofmt -w .'"
            exit 1
          fi

      - run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Cross-build linux/amd64+arm64
        run: |
          mkdir -p dist
          ver="dev-${GITHUB_SHA::7}"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=${ver}" \
              -o dist/sas_exporter_linux_${arch} .
          done

      - name: Scan with VirusTotal
        if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v') && env.VT_API_KEY != '' }}
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: dist/sas_exporter_linux_*

      - name: Upload dev build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: sas_exporter-dev-${{ github.sha }}
          path: dist/sas_exporter_linux_*
          retention-days: 14

  release:
    name: Publish release
    needs: ci
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
              -o dist/sas_exporter_linux_${arch} .
          done

      - name: Scan with VirusTotal
        id: vt
        if: ${{ env.VT_API_KEY != '' }}
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: dist/sas_exporter_linux_*

      - name: VirusTotal summary
        id: vtsum
        if: ${{ env.VT_API_KEY != '' }}
        shell: bash
        run: |
          {
            echo "results<<EOF"
            echo "### VirusTotal scans"
            for f in dist/sas_exporter_linux_*; do
              sha=$(sha256sum "$f" | cut -d ' ' -f1)
              echo "- [$(basename "$f")](https://www.virustotal.com/gui/file/$sha)"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: ${{ steps.vtsum.outputs.results }}
          files: dist/*
