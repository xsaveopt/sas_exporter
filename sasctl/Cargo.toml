[package]
name = "sasctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-2.0-only"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
